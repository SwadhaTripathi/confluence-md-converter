[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "confluence-md-converter"
version = "0.1.0"
description = "Convert Confluence pages (with diagrams) to RAG-friendly markdown without a vision model."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "AMAT internal" }]
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "markdownify>=0.11",
    "python-dotenv>=1.0",
    "truststore>=0.10",
]

[project.optional-dependencies]
ocr = [
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
confluence-to-md = "confluence_md.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
